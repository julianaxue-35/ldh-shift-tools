<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medication Charts — LDH Shift Tools</title>
<style>
:root{
  --ink:#1a1a1a; --ink-soft:#555; --paper:#f4f6f8; --paper-2:#ebedf0;
  --card:#ffffff; --line:#e1e4e8; --line-soft:#f0f2f4;
  --teal:#1f7a4d; --teal-dark:#145536; --teal-soft:#deefe4;
  --rust:#b5462b; --rust-soft:#f6e3dc; --amber:#c98a1a; --amber-soft:#f7ecd2;
  --shadow:0 1px 2px rgba(26,36,33,.06), 0 8px 24px rgba(26,36,33,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5}
.back-nav{background:var(--teal-dark);padding:8px 16px}
.back-nav a{color:#fff;font-size:12.5px;text-decoration:none;font-weight:600}
header.top{background:var(--teal);padding:12px 16px;color:#fff}
header.top h1{font-size:17px;font-weight:600;margin:0}
header.top p{font-size:12.5px;opacity:.9;margin:4px 0 0}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
.btn.secondary{background:var(--paper-2);color:var(--ink);border:1px solid var(--line)}
.btn.rust{background:var(--rust);color:#fff}
.btn.small{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.card-hdr .meta{font-size:12px;color:var(--ink-soft)}
.card-hdr .patient{font-size:15px;font-weight:700}
table.meds{width:100%;border-collapse:collapse;margin-top:6px}
table.meds th,table.meds td{border-bottom:1px solid var(--line-soft);padding:5px 6px;text-align:left;font-size:12.5px}
table.meds th{color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.warn{color:#a33;font-size:11.5px;font-weight:600}
.empty{color:var(--ink-soft);font-size:13.5px;padding:30px 0;text-align:center}
.src-badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:20px;background:var(--teal-soft);color:var(--teal-dark);margin-left:6px}
footer.notice{font-size:11px;color:var(--ink-soft);text-align:center;padding:20px 16px 40px}
</style>
</head>
<body>
<div class="back-nav"><a href="index.html">&larr; Shift Tools</a></div>
<header class="top">
  <h1>Medication Charts</h1>
  <p>Every chart registered from Processing, Sick &amp; Injured, or Surgery on this device. Select the ones you want and export them as one printable Excel workbook.</p>
</header>
<div class="wrap">
  <div class="toolbar">
    <label style="font-size:13px"><input type="checkbox" id="selectAll"> Select all</label>
    <button type="button" class="btn" id="exportBtn">Export selected as Excel</button>
    <button type="button" class="btn secondary" id="deleteSelectedBtn">Delete selected</button>
    <button type="button" class="btn secondary" id="refreshBtn">Refresh</button>
    <span id="countLabel" style="font-size:12.5px;color:var(--ink-soft)"></span>
  </div>
  <div id="list"></div>
</div>
<footer class="notice">Saved locally in this browser only — not shared with any other device or user.</footer>

<script src="vendor/jszip.min.js"></script>
<script src="medchart.js"></script>
<script>
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function sourceLabel(src){
  return {processing:'Processing', 'sick-injured':'Sick & Injured', surgery:'Surgery'}[src] || src;
}

function renderList(){
  const charts = MedChart.loadCharts().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  const list = document.getElementById('list');
  document.getElementById('countLabel').textContent = charts.length ? `${charts.length} chart${charts.length===1?'':'s'} saved` : '';
  if(!charts.length){
    list.innerHTML = '<div class="empty">No medication charts saved yet. From an animal\'s Plan section in Processing, Sick &amp; Injured, or Surgery, click "+ Register medication chart".</div>';
    return;
  }
  list.innerHTML = charts.map(c=>{
    const rows = c.meds.map(m=>`<tr>
      <td>${esc(m.drugLabel)||'<em>(unspecified)</em>'}</td>
      <td>${esc(m.doseText)}</td>
      <td>${esc(m.freq)}</td>
      <td>${esc(m.route)}</td>
      <td>${esc(m.days)}d${m.freq==='SID' ? ' ('+esc(m.startSlot)+' start)' : ''}</td>
    </tr>${(m.drugWarning||(m.warnings&&m.warnings.length)) ? `<tr><td colspan="5" class="warn">${esc([m.drugWarning].concat(m.warnings||[]).filter(Boolean).join(' · '))}</td></tr>` : ''}`).join('');
    return `<div class="card" data-chartid="${esc(c.id)}">
      <div class="card-hdr">
        <div>
          <div class="patient">${esc(c.animalId)||'(no ID)'} <span class="src-badge">${esc(sourceLabel(c.sourceTool))}</span></div>
          <div class="meta">${esc(c.species)} &middot; ${esc(c.weight)||'? '}kg &middot; ${esc(c.location)||'no location'} &middot; Vet: ${esc(c.vetInCharge)||'-'} &middot; saved ${esc((c.createdAt||'').slice(0,16).replace('T',' '))}</div>
          ${c.problemList ? `<div class="meta">Problems: ${esc(c.problemList)}</div>` : ''}
        </div>
        <label style="font-size:12.5px;white-space:nowrap"><input type="checkbox" class="pickChart" data-id="${esc(c.id)}"> Select</label>
      </div>
      <table class="meds">
        <thead><tr><th>Drug</th><th>Dose</th><th>Freq</th><th>Route</th><th>Duration</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="margin-top:8px"><button type="button" class="btn secondary small" data-del="${esc(c.id)}">Delete this chart</button></div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('Delete this medication chart? This cannot be undone.')) return;
      MedChart.deleteChart(btn.dataset.del);
      renderList();
    });
  });
  document.getElementById('selectAll').checked = false;
}

document.getElementById('selectAll').addEventListener('change', (e)=>{
  document.querySelectorAll('.pickChart').forEach(cb=> cb.checked = e.target.checked);
});
document.getElementById('refreshBtn').addEventListener('click', renderList);

function selectedIds(){
  return Array.from(document.querySelectorAll('.pickChart:checked')).map(cb=>cb.dataset.id);
}

document.getElementById('deleteSelectedBtn').addEventListener('click', ()=>{
  const ids = selectedIds();
  if(!ids.length){ alert('Select at least one chart first.'); return; }
  if(!confirm(`Delete ${ids.length} selected chart(s)? This cannot be undone.`)) return;
  ids.forEach(id=> MedChart.deleteChart(id));
  renderList();
});

/* ---------- Excel export: exact clone of the real template ----------
   Builds one real .xlsx with one sheet per selected animal, each sheet
   a byte-for-byte copy of the real 14-Day-Yellow-Medication-Sheet
   template except for the specific data cells — see MedChart.patchSheetXml
   and the parts of workbook.xml/rels/[Content_Types].xml assembled below,
   which just register N sheets instead of the template's original 1. */
const OOXML_PARTS_TO_REPLACE = new Set([
  'xl/worksheets/sheet1.xml', 'xl/workbook.xml', 'xl/_rels/workbook.xml.rels', '[Content_Types].xml'
]);

function xmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function buildExactWorkbook(charts){
  const templateBuf = await fetch(MedChart.TEMPLATE_URL).then(r=>{
    if(!r.ok) throw new Error(`Could not load template (${r.status})`);
    return r.arrayBuffer();
  });
  const templateZip = await JSZip.loadAsync(templateBuf);
  const templateSheetXml = await templateZip.file(MedChart.TEMPLATE_SHEET_PART).async('string');

  const usedNames = new Set();
  const sheetFiles = {};
  const sheetMeta = charts.map((c, i)=>{
    const num = i + 1;
    sheetFiles[`xl/worksheets/sheet${num}.xml`] = MedChart.patchSheetXml(templateSheetXml, c);
    return { num, name: MedChart.safeSheetName(c.animalId, usedNames) };
  });

  const sheetsXml = sheetMeta.map(s=>
    `<sheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" name="${xmlEsc(s.name)}" sheetId="${s.num}" state="visible" r:id="rId${s.num}"/>`
  ).join('');
  const definedNamesXml = sheetMeta.map(s=>
    `<definedName name="_xlnm.Print_Area" localSheetId="${s.num-1}">'${s.name.replace(/'/g,"''")}'!$A$1:$U$48</definedName>`
  ).join('');
  const workbookXml = `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><workbookPr/><workbookProtection/><bookViews><workbookView visibility="visible" minimized="0" showHorizontalScroll="1" showVerticalScroll="1" showSheetTabs="1" tabRatio="600" firstSheet="0" activeTab="0" autoFilterDateGrouping="1"/></bookViews><sheets>${sheetsXml}</sheets><definedNames>${definedNamesXml}</definedNames><calcPr calcId="124519" fullCalcOnLoad="1"/></workbook>`;

  const n = sheetMeta.length;
  const relsSheets = sheetMeta.map(s=>
    `<Relationship Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="/xl/worksheets/sheet${s.num}.xml" Id="rId${s.num}"/>`
  ).join('');
  const relsXml = `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${relsSheets}<Relationship Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml" Id="rId${n+1}"/><Relationship Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml" Id="rId${n+2}"/></Relationships>`;

  const ctOverrides = sheetMeta.map(s=>
    `<Override PartName="/xl/worksheets/sheet${s.num}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`
  ).join('');
  const contentTypesXml = `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>${ctOverrides}<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/></Types>`;

  const outZip = new JSZip();
  for(const name of Object.keys(templateZip.files)){
    const entry = templateZip.files[name];
    if(entry.dir || OOXML_PARTS_TO_REPLACE.has(name)) continue;
    outZip.file(name, await entry.async('uint8array'));
  }
  Object.keys(sheetFiles).forEach(fname=> outZip.file(fname, sheetFiles[fname]));
  outZip.file('xl/workbook.xml', workbookXml);
  outZip.file('xl/_rels/workbook.xml.rels', relsXml);
  outZip.file('[Content_Types].xml', contentTypesXml);

  return outZip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const ids = new Set(selectedIds());
  if(!ids.size){ alert('Select at least one chart first.'); return; }
  const charts = MedChart.loadCharts().filter(c=> ids.has(c.id));
  const overflow = charts.filter(c=> c.meds.length > MedChart.MAX_MEDS_PER_SHEET);
  if(overflow.length){
    const names = overflow.map(c=> c.animalId || '(no ID)').join(', ');
    if(!confirm(`The real template has ${MedChart.MAX_MEDS_PER_SHEET} medication boxes per sheet. ${names} has more than that — only the first ${MedChart.MAX_MEDS_PER_SHEET} will be included. Continue?`)) return;
  }
  const exportBtn = document.getElementById('exportBtn');
  exportBtn.disabled = true; exportBtn.textContent = 'Building…';
  try{
    const blob = await buildExactWorkbook(charts);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `Medication_Charts_${new Date().toISOString().slice(0,10)}.xlsx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(err){
    alert('Export failed: ' + err.message);
  }finally{
    exportBtn.disabled = false; exportBtn.textContent = 'Export selected as Excel';
  }
});

renderList();
</script>
</body>
</html>
